<!DOCTYPE html>
<html lang="he">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>אדם - קוסם נגד מפלצות!</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-fullscreen">
    <meta name="apple-mobile-web-app-title" content="קוסם">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1a0a2e;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100dvh;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        #ui {
            color: white;
            text-align: center;
            margin-bottom: 8px;
            font-size: 22px;
            font-weight: bold;
            text-shadow: 0 0 10px #ff44ff;
        }
        canvas {
            display: block;
            touch-action: none;
            border: 3px solid #8800ff;
            border-radius: 12px;
            box-shadow: 0 0 20px #8800ff88;
        }
    </style>
</head>
<body>
    <div id="ui">
        ❤️ <span id="health">5</span>
        &nbsp;&nbsp;&nbsp;
        ⭐ <span id="score">0</span>
    </div>
    <canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// Canvas size fits the screen
const W = Math.min(window.innerWidth - 10, 480);
const H = Math.min(window.innerHeight - 80, 720);
canvas.width = W;
canvas.height = H;

// ---- GAME STATE ----
let gameState = 'playing';
let gamePaused = false;
let score = 0;
let frameCount = 0;
let touchStartTime = 0, touchStartX = 0, touchStartY = 0;

// ---- PLAYER ----
const player = {
    x: W / 2, y: H / 2,
    r: 22,
    speed: 3.2,
    health: 5,
    invincible: 0,
    dx: 0, dy: 0
};

// ---- FIREBALLS ----
let fireballs = [];
let shootCooldown = 0;
let burstCount = 0;
let burstTimer = 0;
const SHOOT_RATE = 65;

// ---- MONSTERS ----
let monsters = [];
let spawnTimer = 0;
let spawnRate = 110;

// ---- PARTICLES ----
let particles = [];

// ---- VIRTUAL JOYSTICK ----
const joystick = {
    active: false,
    baseX: 0, baseY: 0,
    touchX: 0, touchY: 0,
    radius: 55,
    touchId: null
};

// ---- TOUCH CONTROLS ----
canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    if (gameState === 'gameover') { restartGame(); return; }
    const t0 = e.changedTouches[0];
    touchStartTime = Date.now();
    touchStartX = t0.clientX;
    touchStartY = t0.clientY;
    for (const touch of e.changedTouches) {
        if (!joystick.active) {
            const rect = canvas.getBoundingClientRect();
            joystick.active = true;
            joystick.baseX = touch.clientX - rect.left;
            joystick.baseY = touch.clientY - rect.top;
            joystick.touchX = joystick.baseX;
            joystick.touchY = joystick.baseY;
            joystick.touchId = touch.identifier;
        }
    }
}, { passive: false });

canvas.addEventListener('touchmove', (e) => {
    e.preventDefault();
    for (const touch of e.changedTouches) {
        if (touch.identifier === joystick.touchId) {
            const rect = canvas.getBoundingClientRect();
            joystick.touchX = touch.clientX - rect.left;
            joystick.touchY = touch.clientY - rect.top;
        }
    }
}, { passive: false });

canvas.addEventListener('touchend', (e) => {
    e.preventDefault();
    const t0 = e.changedTouches[0];
    const duration = Date.now() - touchStartTime;
    const moved = Math.hypot(t0.clientX - touchStartX, t0.clientY - touchStartY);
    if (gameState === 'playing' && duration < 200 && moved < 15) {
        gamePaused = !gamePaused;
        joystick.active = false;
        player.dx = 0; player.dy = 0;
        return;
    }
    for (const touch of e.changedTouches) {
        if (touch.identifier === joystick.touchId) {
            joystick.active = false;
            player.dx = 0;
            player.dy = 0;
        }
    }
}, { passive: false });

// ---- KEYBOARD (for PC testing) ----
const keys = {};
document.addEventListener('keydown', e => {
    keys[e.key] = true;
    if (e.key === 'Escape' && gameState === 'playing') gamePaused = !gamePaused;
});
document.addEventListener('keyup', e => keys[e.key] = false);
canvas.addEventListener('click', () => { if (gameState === 'gameover') restartGame(); });

// ---- SPAWN MONSTER ----
function spawnMonster() {
    const side = Math.floor(Math.random() * 4);
    let x, y;
    if (side === 0)      { x = Math.random() * W; y = -35; }
    else if (side === 1) { x = W + 35; y = Math.random() * H; }
    else if (side === 2) { x = Math.random() * W; y = H + 35; }
    else                 { x = -35; y = Math.random() * H; }

    const lvl = Math.min(Math.floor(score / 60) + 1, 6);
    monsters.push({
        x, y,
        r: 18 + lvl * 2.5,
        speed: 0.7 + lvl * 0.28,
        health: lvl + 2,
        maxHealth: lvl + 2,
        wobble: Math.random() * Math.PI * 2,
        color: `hsl(${120 + lvl * 20}, 80%, 45%)`
    });
}

// ---- SHOOT FIREBALL ----
function shoot() {
    let nearest = null, minDist = Infinity;
    for (const m of monsters) {
        const d = Math.hypot(m.x - player.x, m.y - player.y);
        if (d < minDist) { minDist = d; nearest = m; }
    }

    let angle;
    if (nearest) {
        angle = Math.atan2(nearest.y - player.y, nearest.x - player.x);
    } else {
        const len = Math.hypot(player.dx, player.dy);
        if (len < 0.1) return;
        angle = Math.atan2(player.dy, player.dx);
    }

    fireballs.push({
        x: player.x, y: player.y,
        dx: Math.cos(angle) * 7.5,
        dy: Math.sin(angle) * 7.5,
        r: 9, life: 110
    });
}

// ---- SPAWN PARTICLES ----
function spawnParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1.5 + Math.random() * 3;
        particles.push({
            x, y,
            dx: Math.cos(angle) * speed,
            dy: Math.sin(angle) * speed,
            r: 3 + Math.random() * 4,
            life: 25 + Math.random() * 20,
            maxLife: 45,
            color
        });
    }
}

// ---- DRAW WIZARD ----
function drawWizard(x, y, r) {
    ctx.save();
    ctx.translate(x, y);

    // Robe
    ctx.fillStyle = '#7700dd';
    ctx.beginPath();
    ctx.ellipse(0, 6, r * 0.85, r * 1.15, 0, 0, Math.PI * 2);
    ctx.fill();

    // Stars on robe
    ctx.fillStyle = '#ffdd00';
    for (let i = 0; i < 3; i++) {
        const sx = (i - 1) * r * 0.35;
        const sy = r * 0.3 + i * r * 0.15;
        ctx.font = `${r * 0.35}px Arial`;
        ctx.textAlign = 'center';
        ctx.fillText('★', sx, sy);
    }

    // Head
    ctx.fillStyle = '#ffd580';
    ctx.beginPath();
    ctx.arc(0, -r * 0.45, r * 0.55, 0, Math.PI * 2);
    ctx.fill();

    // Hat
    ctx.fillStyle = '#5500cc';
    ctx.beginPath();
    ctx.moveTo(-r * 0.75, -r * 0.65);
    ctx.lineTo(r * 0.75, -r * 0.65);
    ctx.lineTo(0, -r * 1.9);
    ctx.closePath();
    ctx.fill();

    // Hat brim
    ctx.fillStyle = '#6600dd';
    ctx.beginPath();
    ctx.ellipse(0, -r * 0.65, r * 0.85, r * 0.22, 0, 0, Math.PI * 2);
    ctx.fill();

    // Hat star
    ctx.fillStyle = '#ffdd00';
    ctx.font = `${r * 0.4}px Arial`;
    ctx.textAlign = 'center';
    ctx.fillText('✦', 0, -r * 1.3);

    // Eyes
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(-r * 0.2, -r * 0.5, r * 0.13, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc( r * 0.2, -r * 0.5, r * 0.13, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#220088';
    ctx.beginPath(); ctx.arc(-r * 0.2, -r * 0.5, r * 0.07, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc( r * 0.2, -r * 0.5, r * 0.07, 0, Math.PI * 2); ctx.fill();

    // Smile
    ctx.strokeStyle = '#994400';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(0, -r * 0.28, r * 0.18, 0.2, Math.PI - 0.2);
    ctx.stroke();

    ctx.restore();
}

// ---- DRAW MONSTER ----
function drawMonster(m) {
    ctx.save();
    ctx.translate(m.x, m.y);
    m.wobble += 0.05;
    const w = Math.sin(m.wobble) * 0.12;

    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath();
    ctx.ellipse(0, m.r * 0.9, m.r * 0.8, m.r * 0.25, 0, 0, Math.PI * 2);
    ctx.fill();

    // Body
    ctx.fillStyle = m.color;
    ctx.beginPath();
    ctx.ellipse(0, 0, m.r * (1 + w), m.r * (1 - w * 0.5), 0, 0, Math.PI * 2);
    ctx.fill();

    // Horns
    ctx.fillStyle = '#ff3333';
    ctx.beginPath();
    ctx.moveTo(-m.r * 0.45, -m.r * 0.75);
    ctx.lineTo(-m.r * 0.18, -m.r * 1.4);
    ctx.lineTo(m.r * 0.05, -m.r * 0.75);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(m.r * 0.45, -m.r * 0.75);
    ctx.lineTo(m.r * 0.18, -m.r * 1.4);
    ctx.lineTo(-m.r * 0.05, -m.r * 0.75);
    ctx.fill();

    // Eyes
    ctx.fillStyle = '#ffee00';
    ctx.beginPath(); ctx.arc(-m.r * 0.3, -m.r * 0.2, m.r * 0.2, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc( m.r * 0.3, -m.r * 0.2, m.r * 0.2, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#cc0000';
    ctx.beginPath(); ctx.arc(-m.r * 0.3, -m.r * 0.2, m.r * 0.1, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc( m.r * 0.3, -m.r * 0.2, m.r * 0.1, 0, Math.PI * 2); ctx.fill();

    // Angry brows
    ctx.strokeStyle = '#220000';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(-m.r * 0.5, -m.r * 0.45);
    ctx.lineTo(-m.r * 0.1, -m.r * 0.35);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(m.r * 0.5, -m.r * 0.45);
    ctx.lineTo(m.r * 0.1, -m.r * 0.35);
    ctx.stroke();

    // Mouth (fangs)
    ctx.fillStyle = '#000000';
    ctx.beginPath();
    ctx.arc(0, m.r * 0.2, m.r * 0.32, 0.1, Math.PI - 0.1);
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.moveTo(-m.r * 0.2, m.r * 0.2);
    ctx.lineTo(-m.r * 0.15, m.r * 0.38);
    ctx.lineTo(-m.r * 0.05, m.r * 0.2);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(m.r * 0.2, m.r * 0.2);
    ctx.lineTo(m.r * 0.15, m.r * 0.38);
    ctx.lineTo(m.r * 0.05, m.r * 0.2);
    ctx.fill();

    // Health bar
    if (m.health < m.maxHealth) {
        const bw = m.r * 2.2;
        ctx.fillStyle = '#660000';
        ctx.fillRect(-m.r * 1.1, -m.r - 12, bw, 7);
        ctx.fillStyle = '#00ff44';
        ctx.fillRect(-m.r * 1.1, -m.r - 12, bw * (m.health / m.maxHealth), 7);
    }

    ctx.restore();
}

// ---- DRAW FIREBALL ----
function drawFireball(f) {
    ctx.save();
    const grad = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.r * 2.5);
    grad.addColorStop(0,   'rgba(255,255,180,0.9)');
    grad.addColorStop(0.4, 'rgba(255,120,0,0.7)');
    grad.addColorStop(1,   'rgba(255,0,0,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(f.x, f.y, f.r * 2.5, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#fff8a0';
    ctx.beginPath();
    ctx.arc(f.x, f.y, f.r * 0.65, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
}

// ---- DRAW PARTICLES ----
function drawParticles() {
    for (const p of particles) {
        const alpha = p.life / p.maxLife;
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r * alpha, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }
}

// ---- DRAW JOYSTICK ----
function drawJoystick() {
    if (!joystick.active) return;
    ctx.save();
    ctx.strokeStyle = 'rgba(255,255,255,0.25)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(joystick.baseX, joystick.baseY, joystick.radius, 0, Math.PI * 2);
    ctx.stroke();

    const dx = joystick.touchX - joystick.baseX;
    const dy = joystick.touchY - joystick.baseY;
    const dist = Math.min(Math.hypot(dx, dy), joystick.radius);
    const angle = Math.atan2(dy, dx);
    const kx = joystick.baseX + Math.cos(angle) * dist;
    const ky = joystick.baseY + Math.sin(angle) * dist;

    ctx.fillStyle = 'rgba(200,150,255,0.45)';
    ctx.beginPath();
    ctx.arc(kx, ky, joystick.radius * 0.42, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
}

// ---- DRAW BACKGROUND ----
function drawBackground() {
    ctx.fillStyle = '#0d0020';
    ctx.fillRect(0, 0, W, H);

    ctx.strokeStyle = 'rgba(100, 50, 160, 0.18)';
    ctx.lineWidth = 1;
    for (let x = 0; x < W; x += 55) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
    }
    for (let y = 0; y < H; y += 55) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }

    ctx.strokeStyle = '#8800ff';
    ctx.lineWidth = 3;
    ctx.strokeRect(2, 2, W - 4, H - 4);
}

// ---- PAUSE SCREEN ----
function drawPause() {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.shadowColor = '#000'; ctx.shadowBlur = 8;
    ctx.fillStyle = '#ffffff';
    ctx.font = `bold ${Math.floor(W * 0.11)}px Arial`;
    ctx.fillText('⏸ השהה', W / 2, H * 0.44);
    ctx.fillStyle = '#ffdd00';
    ctx.font = `${Math.floor(W * 0.055)}px Arial`;
    ctx.fillText('לחץ להמשיך', W / 2, H * 0.56);
    ctx.shadowBlur = 0;
}

// ---- GAME OVER SCREEN ----
function drawGameOver() {
    ctx.fillStyle = 'rgba(0,0,0,0.72)';
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = 'center';

    ctx.font = `bold ${Math.floor(W * 0.1)}px Arial`;
    ctx.fillStyle = '#ff4444';
    ctx.fillText('💀 GAME OVER! 💀', W / 2, H * 0.38);

    ctx.font = `${Math.floor(W * 0.065)}px Arial`;
    ctx.fillStyle = '#ffffff';
    ctx.fillText(`ניקוד סופי: ${score}`, W / 2, H * 0.52);

    ctx.font = `bold ${Math.floor(W * 0.057)}px Arial`;
    ctx.fillStyle = '#ffdd00';
    ctx.fillText('לחץ כדי לנסות שוב!', W / 2, H * 0.67);
}

// ---- RESTART ----
function restartGame() {
    gameState = 'playing';
    gamePaused = false;
    score = 0;
    player.x = W / 2; player.y = H / 2;
    player.health = 5; player.invincible = 0;
    player.dx = 0; player.dy = 0;
    monsters = []; fireballs = []; particles = [];
    spawnTimer = 0; spawnRate = 110; shootCooldown = 0; burstCount = 0; burstTimer = 0;
    document.getElementById('health').textContent = '5';
    document.getElementById('score').textContent = '0';
}

// ---- MAIN LOOP ----
function gameLoop() {
    frameCount++;

    if (gameState === 'playing' && gamePaused) {
        drawBackground();
        drawParticles();
        for (const f of fireballs) drawFireball(f);
        for (const m of monsters) drawMonster(m);
        if (player.invincible <= 0 || Math.floor(player.invincible / 6) % 2 === 0)
            drawWizard(player.x, player.y, player.r);
        drawPause();
        requestAnimationFrame(gameLoop);
        return;
    }

    if (gameState === 'playing') {

        // Joystick input
        if (joystick.active) {
            const dx = joystick.touchX - joystick.baseX;
            const dy = joystick.touchY - joystick.baseY;
            const dist = Math.hypot(dx, dy);
            if (dist > 8) {
                player.dx = (dx / dist) * player.speed;
                player.dy = (dy / dist) * player.speed;
            } else {
                player.dx = 0; player.dy = 0;
            }
        }

        // Keyboard input
        if (!joystick.active) {
            player.dx = 0; player.dy = 0;
            if (keys['ArrowLeft']  || keys['a']) player.dx = -player.speed;
            if (keys['ArrowRight'] || keys['d']) player.dx =  player.speed;
            if (keys['ArrowUp']    || keys['w']) player.dy = -player.speed;
            if (keys['ArrowDown']  || keys['s']) player.dy =  player.speed;
        }

        // Move player (stay inside canvas)
        player.x = Math.max(player.r, Math.min(W - player.r, player.x + player.dx));
        player.y = Math.max(player.r, Math.min(H - player.r, player.y + player.dy));

        // Auto shoot at nearest monster
        if (burstCount > 0) {
            burstTimer--;
            if (burstTimer <= 0 && monsters.length > 0) {
                shoot();
                burstCount--;
                burstTimer = 10;
            }
        }
        shootCooldown--;
        if (shootCooldown <= 0 && monsters.length > 0 && burstCount === 0) {
            burstCount = 3;
            burstTimer = 0;
            shootCooldown = SHOOT_RATE;
        }

        // Update fireballs
        fireballs = fireballs.filter(f => {
            f.x += f.dx; f.y += f.dy; f.life--;
            return f.life > 0 && f.x > -30 && f.x < W + 30 && f.y > -30 && f.y < H + 30;
        });

        // Spawn monsters
        spawnTimer++;
        if (spawnTimer >= spawnRate && monsters.length < 10) {
            spawnTimer = 0;
            spawnRate = Math.max(70, 120 - score * 0.2);
            spawnMonster();
            if (score > 150 && monsters.length < 10 && Math.random() < 0.3) spawnMonster();
        }

        // Move monsters toward player
        for (const m of monsters) {
            const angle = Math.atan2(player.y - m.y, player.x - m.x);
            m.x += Math.cos(angle) * m.speed;
            m.y += Math.sin(angle) * m.speed;
        }

        // Fireball vs monster collision
        for (let i = fireballs.length - 1; i >= 0; i--) {
            const f = fireballs[i];
            for (let j = monsters.length - 1; j >= 0; j--) {
                const m = monsters[j];
                if (Math.hypot(f.x - m.x, f.y - m.y) < f.r + m.r) {
                    spawnParticles(m.x, m.y, '#ff8800', 6);
                    fireballs.splice(i, 1);
                    m.health--;
                    if (m.health <= 0) {
                        spawnParticles(m.x, m.y, '#00ff88', 12);
                        monsters.splice(j, 1);
                        score += 10;
                        document.getElementById('score').textContent = score;
                    }
                    break;
                }
            }
        }

        // Monster vs player collision
        if (player.invincible <= 0) {
            for (const m of monsters) {
                if (Math.hypot(player.x - m.x, player.y - m.y) < player.r + m.r - 5) {
                    player.health--;
                    player.invincible = 65;
                    document.getElementById('health').textContent = player.health;
                    if (player.health <= 0) gameState = 'gameover';
                    break;
                }
            }
        } else {
            player.invincible--;
        }

        // Update particles
        particles = particles.filter(p => {
            p.x += p.dx; p.y += p.dy;
            p.dx *= 0.92; p.dy *= 0.92;
            p.life--;
            return p.life > 0;
        });

        // --- DRAW ---
        drawBackground();
        drawParticles();
        for (const f of fireballs) drawFireball(f);
        for (const m of monsters) drawMonster(m);

        // Flash wizard when hit
        if (player.invincible <= 0 || Math.floor(player.invincible / 6) % 2 === 0) {
            drawWizard(player.x, player.y, player.r);
        }

        drawJoystick();

        if (player.invincible > 0) {
            ctx.fillStyle = 'rgba(255,0,0,0.12)';
            ctx.fillRect(0, 0, W, H);
        }

    } else if (gameState === 'gameover') {
        drawBackground();
        for (const m of monsters) drawMonster(m);
        drawGameOver();
    }

    requestAnimationFrame(gameLoop);
}

gameLoop();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').then(reg => {
    reg.addEventListener('updatefound', () => {
      const newSW = reg.installing;
      newSW.addEventListener('statechange', () => {
        if (newSW.state === 'activated') location.reload();
      });
    });
  });
}
</script>
</body>
</html>
